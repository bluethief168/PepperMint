<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>PepperHash - 椒图哈希</title>
  <style>
    :root {
      --primary-color: #0064e0;
      --primary-hover: #0053ba;
      --primary-active: #004397;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --input-bg: #f5f6f8;
      --text-color: #1c2b33;
      --hint-color: #65676b;
      --border-color: #e4e6eb;
      --success-color: #00a884;
      --error-bg: #ffebe9;
      --error-color: #fa3e3e;
      --focus-ring: rgba(0, 100, 224, 0.2);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #0064e0;
        --primary-hover: #1877f2;
        --primary-active: #388bfd;
        --bg-color: #0f1419;
        --card-bg: #1c242d;
        --input-bg: #27313d;
        --text-color: #f5f6f8;
        --hint-color: #8b98a5;
        --border-color: #2f3b47;
        --success-color: #00a884;
        --error-bg: #3c1e22;
        --error-color: #ff6b6b;
        --focus-ring: rgba(0, 100, 224, 0.4);
        --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
    }
    
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 40px 16px 56px 16px; 
      margin: 0 auto; 
      max-width: 800px; 
    }

    .app-header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-logo {
      width: 220px;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 100, 224, 0.12));
      transition: transform 0.2s ease;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .option { 
      margin-bottom: 20px; 
    }

    .option:last-child {
      margin-bottom: 0;
    }
    
    label {
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      font-size: 0.9em;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .checkbox-label {
      font-weight: 400;
      padding: 6px 0;
      width: 100%;
      margin-bottom: 0;
      transition: color 0.15s ease;
    }

    input[type="text"], select { 
      width: 100%; 
      padding: 12px 14px; 
      margin-top: 4px;
      font-size: 15px; 
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--input-bg);
      color: var(--text-color);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary-color);
      background-color: var(--card-bg);
      box-shadow: 0 0 0 3.5px var(--focus-ring);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0 12px 0 0;
      accent-color: var(--primary-color);
      cursor: pointer;
      border-radius: 4px;
    }

    .symbol-box {
      margin-top: 8px;
      margin-left: 30px;
      display: block;
    }

    .hint-text {
      font-size: 0.78em;
      color: var(--hint-color);
      margin-top: 6px;
      display: block;
      line-height: 1.4;
    }

    .pepper-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .pepper-buttons-row {
      display: flex;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .pepper-len-container {
      display: flex;
      align-items: center;
      text-indent: -2px;
      gap: 4px;
      background-color: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 0 10px;
    }

    .pepper-len-container input {
      width: 25px;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 0.82em;
      font-weight: 400;
      color: var(--text-color);
      padding: 8px 0;
      margin: 0;
      outline: none;
    }

    .pepper-len-container span {
      font-size: 0.75em;
      color: var(--hint-color);
      white-space: nowrap;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px 8px;
      font-size: 0.82em;
      font-weight: 600;
      letter-spacing: 1px;
      text-indent: 1px;
      background-color: var(--primary-color);
      color: #ffffff; 
      border: 1px solid var(--border-color);
      border-radius: 10px;
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-secondary:active {
      background-color: var(--border-color);
      transform: scale(0.98);
    }
    
    button[type="submit"] { 
      width: 100%; 
      padding: 14px; 
      background-color: var(--primary-color); 
      color: #ffffff; 
      letter-spacing: 1px;
      text-indent: 1px;
      border: none; 
      border-radius: 14px; 
      font-size: 1em; 
      font-weight: 600; 
      cursor: pointer; 
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 100, 224, 0.3);
    }

    button[type="submit"]:hover {
      background-color: var(--primary-hover);
    }

    button[type="submit"]:active {
      background-color: var(--primary-active);
      transform: scale(0.99);
    }
    
    .btn-copy { 
      background-color: var(--primary-color); 
      color: #ffffff;
      margin-top: 14px; 
      display: none; 
      padding: 14px; 
      width: 100%;
      border: none; 
      border-radius: 14px; 
      font-size: 0.95em; 
      font-weight: 600; 
      letter-spacing: 1px;
      text-indent: 1px;
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 100, 224, 0.2);
    }

    .btn-copy:active {
      transform: scale(0.99);
      opacity: 0.9;
    }
    
    #res { 
      margin-top: 16px; 
      font-weight: 600; 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 1.05em; 
      word-break: break-all; 
      color: var(--text-color); 
      background: var(--input-bg); 
      padding: 16px; 
      border-radius: 14px; 
      min-height: 56px; 
      display: flex; 
      align-items: center; 
      white-space: pre-wrap;
      border: 1.5px dashed var(--border-color);
      transition: all 0.2s ease;
    }

    #res:empty {
      display: none;
    }
    
    .error { 
      color: var(--error-color) !important; 
      background: var(--error-bg) !important; 
      font-size: 0.88em !important; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      border: 1px solid var(--error-color) !important;
    }
  </style>
</head>

  <form id="pwdForm" onsubmit="event.preventDefault(); handleGen();">
    <div class="card">
      <div class="option">
        <label for="text">任意字符</label>
        <input type="text" id="text" placeholder="请输入任意字符" autocomplete="off" spellcheck="false">
      </div>

      <div class="option">
        <label for="pepperInput">安全密钥 (Pepper - 可选)</label>
        <input type="text" id="pepperInput" placeholder="自定义Pepper (留空则不使用)" autocomplete="off" spellcheck="false">
        
        <div class="pepper-controls">
          <select id="pepperSelect" onchange="selectPepper(this.value)">
            <option value="">-- 选择历史 Pepper --</option>
          </select>
          <div class="pepper-buttons-row">
            <button type="button" class="btn-secondary" onclick="generateRandomPepper()">随机生成</button>
            <div class="pepper-len-container">
              <input type="text" id="pepperLenInput" value="64" maxlength="2" inputmode="numeric" pattern="[0-9]*" oninput="validateLenInput(this)">
              <span>位</span>
            </div>
            <button type="button" class="btn-secondary" onclick="saveCurrentPepper()">保存</button>
            <button type="button" class="btn-secondary" onclick="deleteSelectedPepper()">删除</button>
          </div>
        </div>
        <small class="hint-text">* Pepper 用于增强生成密码的安全性，建议妥善保管。</small>
      </div>

      <div class="option">
        <label for="length">密码长度 (4-64)</label>
        <input type="text" id="length" value="16" maxlength="2" inputmode="numeric" pattern="[0-9]*" oninput="validateLenInput(this)">
      </div>

      <div class="option" style="margin-bottom: 0;">
        <label style="margin-bottom: 8px;">字符包含选项</label>
        <div>
          <label class="checkbox-label"><input type="checkbox" id="num" checked> 包含数字 (0-9)</label>
          <label class="checkbox-label"><input type="checkbox" id="upper" checked> 包含大写字母 (A-Z)</label>
          <label class="checkbox-label"><input type="checkbox" id="lower" checked> 包含小写字母 (a-z)</label>
          <label class="checkbox-label"><input type="checkbox" id="symbol" checked onchange="toggleSymbolInput(this)"> 包含自定义特殊符号</label>
        </div>
        
        <div id="symbolBox" class="symbol-box">
          <input type="text" id="customSymbols" value="!@#$%^&*()_+-=[]{}" placeholder="仅允许英文半角符号" oninput="sanitizeSymbols(this)" spellcheck="false" autocomplete="off">
          <small class="hint-text">* 仅支持英文半角标点，已自动屏蔽非 ASCII 字符。</small>
        </div>
      </div>
    </div>

    <button type="submit" id="genBtn">生成密码</button>
  </form>
  
  <div id="res"></div>
  <button id="copyBtn" class="btn-copy" onclick="copyPwd()">一键复制密码</button>

  <script>
    "use strict";

    let copyResetTimer = null;
    const PEPPER_STORAGE_KEY = "determipass_peppers";

    document.addEventListener("DOMContentLoaded", () => {
      loadPepperHistory();
    });

    function generateRandomPepper() {
      let len = parseInt(document.getElementById('pepperLenInput').value, 10);
      if (isNaN(len)) len = 64;
      if (len > 64) len = 64;
      document.getElementById('pepperLenInput').value = len;

      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
      let result = "";
      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint8Array(len);
        window.crypto.getRandomValues(values);
        for (let i = 0; i < len; i++) {
          result += chars[values[i] % chars.length];
        }
      } else {
        for (let i = 0; i < len; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
      }
      document.getElementById('pepperInput').value = result;
    }

    function loadPepperHistory() {
      const select = document.getElementById('pepperSelect');
      select.innerHTML = '<option value="">-- 选择历史 Pepper --</option>';
      const history = getPepperHistory();
      history.forEach((pepper, index) => {
        const opt = document.createElement('option');
        opt.value = pepper;
        opt.textContent = `Pepper ${index + 1}: ${pepper.substring(0, 16)}... (${pepper.length}位)`;
        select.appendChild(opt);
      });
    }

    function getPepperHistory() {
      try {
        const stored = localStorage.getItem(PEPPER_STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveCurrentPepper() {
      const pepper = document.getElementById('pepperInput').value.trim();
      if (!pepper) return;
      
      let history = getPepperHistory();
      if (!history.includes(pepper)) {
        history.push(pepper);
        try {
          localStorage.setItem(PEPPER_STORAGE_KEY, JSON.stringify(history));
          loadPepperHistory();
          document.getElementById('pepperSelect').value = pepper;
        } catch (e) {
          console.error("保存 Pepper 失败", e);
        }
      }
    }

    function selectPepper(val) {
      if (val !== undefined) {
        document.getElementById('pepperInput').value = val;
      }
    }

    function deleteSelectedPepper() {
      const select = document.getElementById('pepperSelect');
      const val = select.value;
      if (!val) return;

      let history = getPepperHistory();
      history = history.filter(p => p !== val);
      try {
        localStorage.setItem(PEPPER_STORAGE_KEY, JSON.stringify(history));
        loadPepperHistory();
        document.getElementById('pepperInput').value = "";
      } catch (e) {
        console.error("删除 Pepper 失败", e);
      }
    }

    function toggleSymbolInput(checkbox) {
      document.getElementById('symbolBox').style.display = checkbox.checked ? 'block' : 'none';
    }

    function validateLenInput(input) {
      input.value = input.value.replace(/[^\d]/g, '');
    }

    function sanitizeSymbols(input) {
      input.value = input.value.replace(/[^\x20-\x7E]/g, '');
    }

    function rotr32(x, n) {
      return ((x >>> n) | (x << (32 - n))) >>> 0;
    }

    function sha256Pure(bytes) {
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];

      const l = bytes.length;
      const bitLen = BigInt(l) * 8n;
      const newLen = Math.ceil((l + 9) / 64) * 64;
      const padded = new Uint8Array(newLen);
      padded.set(bytes);
      padded[l] = 0x80;
      
      const view = new DataView(padded.buffer);
      const highBits = Number((bitLen >> 32n) & 0xFFFFFFFFn);
      const lowBits = Number(bitLen & 0xFFFFFFFFn);
      
      view.setUint32(newLen - 8, highBits, false);
      view.setUint32(newLen - 4, lowBits, false);

      let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      for (let i = 0; i < newLen; i += 64) {
        const W = new Uint32Array(64);
        for (let t = 0; t < 16; t++) W[t] = view.getUint32(i + t * 4, false);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr32(W[t-15], 7) ^ rotr32(W[t-15], 18) ^ (W[t-15] >>> 3);
          const s1 = rotr32(W[t-2], 17) ^ rotr32(W[t-2], 19) ^ (W[t-2] >>> 10);
          W[t] = (W[t-16] + s0 + W[t-7] + s1) >>> 0;
        }
        let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (let t = 0; t < 64; t++) {
          const S1 = rotr32(e, 6) ^ rotr32(e, 11) ^ rotr32(e, 25);
          const ch = (e & f) ^ ((~e) & g);
          const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
          const S0 = rotr32(a, 2) ^ rotr32(a, 13) ^ rotr32(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (S0 + maj) >>> 0;

          h = g; g = f; f = e; 
          e = (d + temp1) >>> 0; 
          d = c; c = b; b = a; 
          a = (temp1 + temp2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }
      const res = new Uint8Array(32);
      const resView = new DataView(res.buffer);
      for (let i = 0; i < 8; i++) resView.setUint32(i * 4, H[i], false);
      return res;
    }

    function stringToUtf8ByteArray(str) {
      const out = [];
      for (let i = 0; i < str.length; i++) {
        let c = str.charCodeAt(i);
        if (c < 0x80) {
          out.push(c);
        } else if (c < 0x800) {
          out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
        } else if ((c & 0xfc00) === 0xd800 && i + 1 < str.length && (str.charCodeAt(i + 1) & 0xfc00) === 0xdc00) {
          c = 0x10000 + ((c & 0x03ff) << 10) + (str.charCodeAt(++i) & 0x03ff);
          out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        } else {
          out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
      }
      return new Uint8Array(out);
    }

    function showError(msg) {
      const resDiv = document.getElementById('res');
      resDiv.className = "error";
      resDiv.textContent = msg;
      document.getElementById('copyBtn').style.display = "none";
    }

    function resetCopyBtn() {
      if (copyResetTimer) {
        clearTimeout(copyResetTimer);
        copyResetTimer = null;
      }
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "一键复制密码";
      copyBtn.style.backgroundColor = "var(--primary-color)";
    }

    // 高级分层密钥派生算法（类似 Spectre 域隔离理念 + 多轮迭代混淆）
    function hierarchicalDerive(domainText, pepperText, iterations = 3) {
      // 1. 将 Domain 与 Pepper 通过定界符安全复合，确保域隔离
      let currentBytes = stringToUtf8ByteArray("PepperHashV2::Domain[" + domainText + "]::Pepper[" + pepperText + "]");
      
      // 2. 多轮迭代混淆（增加离线暴力破解成本）
      for (let i = 0; i < iterations; i++) {
        const roundSalt = stringToUtf8ByteArray("Round_" + i + "_" + domainText.length);
        const combined = new Uint8Array(currentBytes.length + roundSalt.length);
        combined.set(currentBytes);
        combined.set(roundSalt, currentBytes.length);
        currentBytes = sha256Pure(combined);
      }
      return currentBytes;
    }

    function mapEntropyToPool(entropyArray, pool, targetLen) {
      const pLen = pool.length;
      const limit = Math.floor(256 / pLen) * pLen;
      const result = [];
      
      let eIndex = 0;
      let counter = 0;

      while (result.length < targetLen) {
        if (eIndex >= entropyArray.length) {
          counter++;
          const salt = stringToUtf8ByteArray("DetermiPassPoolSalt_" + counter);
          const combined = new Uint8Array(entropyArray.length + salt.length);
          combined.set(entropyArray);
          combined.set(salt, entropyArray.length);
          entropyArray = sha256Pure(combined);
          eIndex = 0;
        }

        const val = entropyArray[eIndex++];
        if (val < limit) {
          result.push(pool[val % pLen]);
        }
      }
      return result.join('');
    }

    function handleGen() {
      resetCopyBtn();
      const resDiv = document.getElementById('res');
      resDiv.className = "";
      
      const rawInput = document.getElementById('text').value;
      if (!rawInput) {
        showError("请输入任意字符！");
        return;
      }

      const pepperInput = document.getElementById('pepperInput').value;

      const charArray = Array.from(rawInput);
      if (charArray.length > 10000) {
        showError("输入字符过长（限制 10,000 字符以内）！");
        return;
      }

      let pool = "";
      if (document.getElementById('num').checked) pool += "0123456789";
      if (document.getElementById('upper').checked) pool += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (document.getElementById('lower').checked) pool += "abcdefghijklmnopqrstuvwxyz";
      
      if (document.getElementById('symbol').checked) {
        const customSyms = document.getElementById('customSymbols').value;
        
        if (/[^\x20-\x7E]/.test(customSyms)) {
          showError("特殊字符框中包含非半角 ASCII 字符！");
          return;
        }

        if (!customSyms) {
          showError("勾选特殊字符时，自定义集合不能为空！");
          return;
        }

        const uniqueSyms = Array.from(new Set(customSyms.split(''))).join('');
        pool += uniqueSyms;
      }

      if (pool === "") {
        showError("请至少勾选一种字符类型！");
        return;
      }

      let len = parseInt(document.getElementById('length').value, 10);
      if (isNaN(len) || len < 4) len = 4;
      if (len > 64) len = 64;
      document.getElementById('length').value = len;

      try {
        // 调用升级后的高级分层密钥派生算法
        const primaryEntropy = hierarchicalDerive(rawInput, pepperInput);
        const finalPassword = mapEntropyToPool(primaryEntropy, pool, len);

        resDiv.textContent = finalPassword;
        document.getElementById('copyBtn').style.display = "block";
      } catch (err) {
        showError("生成失败: " + (err.message || "未知计算错误"));
      }
    }

    function copyPwd() {
      const pwd = document.getElementById('res').textContent;
      if (!pwd || document.getElementById('res').classList.contains("error")) return;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(pwd)
          .then(showSuccess)
          .catch(() => fallbackCopy(pwd));
      } else {
        fallbackCopy(pwd);
      }
    }

    function fallbackCopy(text) {
      let textarea = null;
      try {
        textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.top = "-9999px";
        textarea.style.left = "-9999px";
        textarea.setAttribute("readonly", "");

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);

        const successful = document.execCommand("copy");
        if (successful) {
          showSuccess();
        } else {
          showCopyError();
        }
      } catch (err) {
        showCopyError();
      } finally {
        if (textarea && textarea.parentNode) {
          textarea.parentNode.removeChild(textarea);
        }
      }
    }

    function showSuccess() {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "已复制到剪贴板！";
      copyBtn.style.backgroundColor = "var(--success-color)";

      if (copyResetTimer) clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(() => {
        resetCopyBtn();
      }, 3000);
    }

    function showCopyError() {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "复制失败，请长按密码框手动复制";
      copyBtn.style.backgroundColor = "var(--error-color)";
    }

    window.addEventListener('error', function (e) {
      console.error('DetermiPass Internal Guarded Error:', e.error);
    });
  </script>
</body>
</html>
